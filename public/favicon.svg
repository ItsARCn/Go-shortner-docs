<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bgSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="35%" stop-color="#0e131b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Radial Emerald Ambient Halo -->
    <radialGradient id="haloGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Ring -->
    <linearGradient id="borderRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Top-Right Link Gradient (Emerald to Mint) -->
    <linearGradient id="linkTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Bottom-Left Link Gradient (Teal to Emerald) -->
    <linearGradient id="linkBot" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="emblemShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgSurface)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#haloGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderRing)" stroke-width="3"/>
  <rect x="30" y="30" width="452" height="452" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Emblem Group rotated -45 deg -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#emblemShadow)">
    <!-- Link 2 (Top-Right Link in rotation) -->
    <rect x="236" y="206" width="174" height="100" rx="50"
          fill="none" stroke="url(#linkTop)" stroke-width="32" stroke-linejoin="round"/>

    <!-- Link 1 (Bottom-Left Link in rotation) -->
    <rect x="102" y="206" width="174" height="100" rx="50"
          fill="none" stroke="url(#linkBot)" stroke-width="32" stroke-linejoin="round"/>

    <!-- Interlock: Top bar of Link 1 weaves OVER Link 2 -->
    <path d="M 185 206 L 276 206"
          fill="none" stroke="url(#linkTop)" stroke-width="32" stroke-linecap="round"/>

    <!-- Speed Lightning Bolt / Instant Redirect Blade -->
    <polygon points="264,175 232,248 260,248 248,337 280,264 252,264"
             fill="#10b981" opacity="0.55" filter="blur(5px)"/>
    <polygon points="264,175 232,248 260,248 248,337 280,264 252,264"
             fill="url(#boltGrad)"/>
    <circle cx="256" cy="256" r="5" fill="#ffffff"/>
  </g>
</svg>