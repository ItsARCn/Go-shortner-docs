<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 48" width="162" height="48" fill="none">
  <defs>
    <linearGradient id="hLinkTop_False" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="hLinkBot_False" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark: Scaled & Centered around (24, 24) -->
  <g transform="translate(24, 24) scale(0.082) translate(-256, -256)">
    <!-- Ambient circle behind icon -->
    <circle cx="256" cy="256" r="180" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="12"/>
    
    <!-- Link rotated -45 -->
    <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
      <!-- Link 2 (Top-Right) -->
      <rect x="236" y="206" width="174" height="100" rx="50"
            fill="none" stroke="url(#hLinkTop_False)" stroke-width="34" stroke-linejoin="round"/>
      <!-- Link 1 (Bottom-Left) -->
      <rect x="102" y="206" width="174" height="100" rx="50"
            fill="none" stroke="url(#hLinkBot_False)" stroke-width="34" stroke-linejoin="round"/>
      <!-- Weave Overlap -->
      <path d="M 185 206 L 276 206"
            fill="none" stroke="url(#hLinkTop_False)" stroke-width="34" stroke-linecap="round"/>
      <!-- Lightning Spark -->
      <polygon points="264,175 232,248 260,248 248,337 280,264 252,264"
               fill="#ffffff"/>
      <circle cx="256" cy="256" r="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- 'GO' in Bold Primary -->
    <text x="54" y="32" font-size="22" font-weight="800" fill="#059669" letter-spacing="-0.5px">GO</text>
    
    <!-- Subtle Divider -->
    <line x1="93" y1="16" x2="93" y2="32" stroke="#a1a1aa" stroke-width="1.5" opacity="0.5"/>
    
    <!-- 'Docs' in Contrast Text -->
    <text x="103" y="31" font-size="16" font-weight="600" fill="#09090b" letter-spacing="-0.2px">Docs</text>
  </g>
</svg>